name: 多平台打包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: macos-latest
            artifact: macos-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
          sudo apt-get install -y libportmidi0 || sudo apt-get install -y libportmidi2

      - name: Install Pyxel and PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build native package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build TinyKnight TinyKnight.app TinyKnight.spec
          mkdir -p build/TinyKnight packages
          cp main.py art.py build/TinyKnight/
          python -m pyxel package build/TinyKnight build/TinyKnight/main.py
          python -m pyxel app2exe TinyKnight.pyxapp

          if [ -d TinyKnight.app ]; then
            tar -a -cf "packages/TinyKnight-${{ matrix.artifact }}.zip" TinyKnight.app
          elif [ -d TinyKnight ]; then
            tar -a -cf "packages/TinyKnight-${{ matrix.artifact }}.zip" TinyKnight
          else
            echo "app2exe produced no TinyKnight or TinyKnight.app"
            ls -la
            exit 1
          fi

      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: TinyKnight-${{ matrix.artifact }}
          path: packages/TinyKnight-${{ matrix.artifact }}.zip
          if-no-files-found: error

  portable:
    name: pyxapp-html
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0
          sudo apt-get install -y libportmidi0 || sudo apt-get install -y libportmidi2

      - name: Install Pyxel
        run: python -m pip install -r requirements.txt

      - name: Build pyxapp and HTML
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/TinyKnight dist
          cp main.py art.py build/TinyKnight/
          python -m pyxel package build/TinyKnight build/TinyKnight/main.py
          python -m pyxel app2html TinyKnight.pyxapp
          mv -f TinyKnight.pyxapp TinyKnight.html dist/

      - name: Upload portable builds
        uses: actions/upload-artifact@v4
        with:
          name: TinyKnight-portable
          path: |
            dist/TinyKnight.pyxapp
            dist/TinyKnight.html
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [native, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          {
            echo "Tiny Knight ${tag}"
            echo
            echo "- \`TinyKnight-windows-x64.zip\`：解压后运行 \`TinyKnight/TinyKnight.exe\`，需要整个文件夹"
            echo "- \`TinyKnight-linux-x64.zip\`：解压后运行 \`TinyKnight/TinyKnight\`"
            echo "- \`TinyKnight-macos-arm64.zip\`：Apple Silicon，解压后打开 \`TinyKnight.app\`"
            echo "- \`TinyKnight.pyxapp\`：需要本机已安装 Pyxel，用 \`pyxel play\` 运行"
            echo "- \`TinyKnight.html\`：浏览器打开；首次加载需要联网"
            echo
            echo "macOS 包未签名。若系统拦截，在访达中右键应用并选择“打开”。"
          } > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$tag" \
              --notes-file notes.md \
              --verify-tag
          fi
